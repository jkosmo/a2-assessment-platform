<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klasser – A2 Content</title>
    <link rel="stylesheet" href="/static/shared.css" />
    <link rel="stylesheet" href="/static/loading.css" />
    <link rel="stylesheet" href="/static/toast.css" />
    <style>
      .content-area-nav { display: flex; gap: 0; border-bottom: 2px solid var(--color-border-soft); margin-bottom: var(--space-3); }
      .content-area-nav-link { padding: 10px var(--space-2); font-size: 14px; font-weight: 600; color: var(--color-meta); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
      .content-area-nav-link:hover { color: var(--color-text); }
      .content-area-nav-link.active { color: var(--color-link-active); border-bottom-color: var(--color-blue); }
      /* #1046: sidehode, filtre og tabell er den felles listesida (list-page.js + shared.css). */
      /* #705-UX: .row-action-btn + .row-actions arves fra shared.css (felles utseende på tvers). */
      .system-badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--color-blue-light); color: var(--color-link-active); font-size: 11px; font-weight: 600; }
      .detail-section { background: var(--color-surface); border: 1px solid var(--color-border-soft); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: var(--space-2); margin-bottom: var(--space-3); }
      .detail-section h2 { font-size: 16px; margin: 0 0 var(--space-2); }
      /* #1046 G1/G2: radene og «legg til»-linja er de delte .form-row/.form-add-row i shared.css. */
      .search-results { list-style: none; margin: 4px 0 0; padding: 0; border: 1px solid var(--color-border-soft); border-radius: var(--radius-card); max-height: 220px; overflow-y: auto; }
      .search-results:empty { display: none; }
      .search-results li { padding: 6px 10px; cursor: pointer; font-size: 13px; }
      .search-results li:hover { background: var(--color-row-hover); }
      /* #1046 B1: .back-link arves fra shared.css. */
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-nav">Skip to main content</a>
    <main id="main-content" class="layout-container">
      <div class="page-top-bar">
        <nav id="workspaceNav" class="workspace-nav"></nav>
        <div class="locale-picker">
          <span id="appVersion" class="version-badge">…</span>
          <label for="localeSelect" class="sr-only">Språk</label>
          <select id="localeSelect" class="locale-select-compact"></select>
        </div>
      </div>

      <!-- #765: Klasser lever nå under «Deltakere»-området med felles undernavigasjon (rollegates av
           deltakere-subnav.js). Aktiv fane settes ut fra URL av samme script. -->
      <nav id="deltakereSubnav" class="content-area-nav" aria-label="Deltakere">
        <a href="/deltakere/klasser" class="content-area-nav-link" id="subnavKlasser">Klasser</a>
        <a href="/deltakere/status" class="content-area-nav-link" id="subnavStatus">Status</a>
        <a href="/review" class="content-area-nav-link" id="subnavReview">Manuell behandling</a>
        <a href="/results" class="content-area-nav-link" id="subnavResults">Resultater</a>
      </nav>

      <div id="pageContent">
        <div class="page-loading">Laster…</div>
      </div>
    </main>

    <script type="module" src="/static/admin-content-classes.js"></script>
    <script type="module" src="/static/workspace-help.js"></script>
    <script type="module" src="/static/deltakere-subnav.js"></script>
  </body>
</html>
